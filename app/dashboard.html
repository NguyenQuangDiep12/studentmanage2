<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống quản lý sinh viên</title>
    <!-- Font Awesome 6.5.1 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css?v=20261029a">
</head>
<body>
    <div class="app-container">
        <!-- ============ TOP HEADER CARD ============ -->
        <header class="top-header-card">
            <div class="header-brand-info">
                <span class="app-tag">School Management System</span>
                <h1>Hệ thống quản lí sinh viên</h1>
                <p>Quản lý hồ sơ, bảng điểm và lịch học trên cùng một giao diện</p>
            </div>
            <div class="header-actions">
                <button class="btn-icon-square" id="btnNotifications" title="Thông báo hệ thống">
                    <i class="fa-solid fa-bell" style="color: #f59e0b;"></i>
                </button>
                <div class="user-profile-pill">
                    <span class="pill-avatar" id="headerAvatar">S</span>
                    <span class="pill-name" id="headerUserName">Xin chào, System Admin</span>
                    <span class="pill-role" id="headerUserRole">Quản trị viên</span>
                </div>
                <button class="btn-pill btn-pill-light" id="btnResetData" style="display:none;" title="Khôi phục dữ liệu mẫu hệ thống">
                    <i class="fa-solid fa-arrows-rotate"></i> Reset dữ liệu
                </button>
                <button class="btn-pill btn-pill-light" id="btnChangePassword" style="display:none;">
                    Đổi mật khẩu
                </button>
                <button class="btn-pill btn-pill-danger" id="btnLogout">
                    Đăng xuất
                </button>
            </div>
        </header>

        <!-- ============ MAIN BODY (SIDEBAR + CONTENT) ============ -->
        <div class="app-body-wrapper">
            <!-- Sidebar -->
            <aside class="app-sidebar" id="sidebar">
                <div class="sidebar-profile-card">
                    <div class="sidebar-profile-avatar" id="sidebarAvatar">SM</div>
                    <div class="sidebar-profile-info">
                        <div class="title" id="sidebarRoleTitle">Quản trị viên</div>
                        <div class="subtitle" id="sidebarGreeting">Xin chào System Admin</div>
                    </div>
                </div>

                <div class="sidebar-menu-list" id="sidebarNav">
                    <!-- Nav items will be dynamically updated by App based on role -->
                </div>
            </aside>

            <!-- Main Content Pane -->
            <main class="main-content-pane">
                <div class="page-title-banner" id="pageBanner">
                    <span class="sub-label" id="pageCategoryLabel">BẢNG ĐIỀU KHIỂN</span>
                    <h2 id="pageMainTitle">Tổng quan</h2>
                    <p id="pageSubTitle">Thống kê hệ thống và dữ liệu nhanh</p>
                </div>

                <!-- Content Area -->
                <div id="contentArea">
                    <!-- Loaded dynamically by JS modules -->
                </div>

                <!-- Nút Hướng dẫn đặt ở cuối trang -->
                <div class="page-help-footer">
                    <button class="btn btn-sm btn-outline-primary" id="btnPageHelp" title="Hướng dẫn thao tác và quy tắc nghiệp vụ của trang này">
                        <i class="fa-solid fa-circle-question"></i> Hướng dẫn
                    </button>
                </div>
            </main>
        </div>
    </div>

    <!-- ============ MODAL OVERLAY ============ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- ============ TOAST CONTAINER ============ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============ SCRIPTS ============ -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Gọi API backend bằng jQuery AJAX -->
    <script src="js/api.js?v=20261026b"></script>

    <!-- UI Components -->
    <script src="js/components/toast.js?v=20261026b"></script>
    <script src="js/components/modal.js?v=20261026b"></script>
    <script src="js/components/header.js?v=20261026b"></script>
    <script src="js/components/sidebar.js?v=20261029a"></script>
    <script src="js/components/dashboard.js?v=20261026b"></script>
    <script src="js/components/help.js?v=20261026b"></script>
    <script src="js/components/giai-thich-diem.js?v=20261026b"></script>

    <!-- App Orchestrator & Router -->
    <script src="js/app.js?v=20261026b"></script>

    <!-- Business Modules -->
    <script src="js/chuong-trinh-dao-tao.js?v=20261026b"></script>
    <script src="js/co-cau-dao-tao.js?v=20261026b"></script>
    <script src="js/mon-hoc.js?v=20261026b"></script>
    <script src="js/lop-hoc-phan.js?v=20261026b"></script>
    <script src="js/dang-ky.js?v=20261026b"></script>
    <script src="js/tkb.js?v=20261026b"></script>
    <script src="js/diem-danh.js?v=20261026b"></script>
    <script src="js/diem.js?v=20261026b"></script>
    <script src="js/ket-qua.js?v=20261026b"></script>
    <script src="js/hoc-ky.js?v=20261026b"></script>
    <script src="js/ds-dang-ky.js?v=20261026b"></script>
    <script src="js/tra-cuu-diem.js?v=20261026b"></script>
    <script src="js/tin-tuc.js?v=20261026b"></script>
    <script src="js/kien-nghi.js?v=20261026b"></script>
    <script src="js/users.js?v=20261026b"></script>
</body>
</html>
